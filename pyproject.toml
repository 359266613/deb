[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-jailbreak-deb-analyzer"
version = "0.1.0"
description = "Static reverse-analysis toolkit for iOS jailbreak deb plugins"
requires-python = ">=3.8"
dependencies = [
  "pyyaml",
  "zstandard",
]

[project.scripts]
deb-analyzer = "deb_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]